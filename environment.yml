name: rag-privacy
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # ================================
  # Python Version
  # ================================
  - python=3.10

  # ================================
  # System Dependencies
  # ================================
  - openjdk=21  # Required for Pyserini

  # ================================
  # FAISS (GPU or CPU)
  # ================================
  # For GPU systems (recommended):
  # - faiss-gpu=1.7.4

  # For CPU-only systems (uncomment and comment above):
  - faiss-cpu=1.7.4

  # ================================
  # Python Dependencies (via pip)
  # ================================
  # NOTE: PyTorch installed separately (see setup.sh)
  # NOTE: Python packages installed via pip in setup.sh (not here to avoid nmslib build issues)
  - pip
